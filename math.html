<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: white;
    color: white;
}
h1 {
    color: #ff0000;
    text-align: left;
}
marquee {
    margin-bottom: 20px;
}
ul {
    list-style-type: none;
    padding: 0;
}
li {
    background: white;
    color: black;
    margin: 10px 0;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #ff0000;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
input, button {
    margin: 5px;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #ff0000;
}
button {
    background-color: #ff0000;
    color: white;
    cursor: pointer;
}
button:hover {
    background-color: #cc0000;
}
.edit-btn {
    background-color: black;
    color: white;
}
.delete-btn {
    background-color: #ff3333;
}
</style>
</head>
<body>
<marquee behavior="scroll" direction="right">
    <img src="https://cdn.dribbble.com/userupload/23457599/file/original-f3dbf495ba28dcc9064683d574f3b4b1.gif" height="100">
</marquee>
<h1>To Do List</h1>
<div>
    <input type="text" id="event-name" placeholder="Event Name">
    <input type="date" id="event-date">
    <button onclick="addEvent()">Add Event</button>
</div>
<ul id="event-list"></ul>
<script>
let events = [];
function renderEvents() {
    const eventList = document.getElementById('event-list');
    eventList.innerHTML = '';
    events.forEach((event, index) => {
        const listItem = document.createElement('li');
        const eventText = document.createElement('span');
        eventText.textContent = `${event.name} - ${new Date(event.date).toDateString()}`;
        listItem.appendChild(eventText);
        const editButton = document.createElement('button');
        editButton.textContent = 'Edit';
        editButton.classList.add('edit-btn');
        editButton.onclick = () => editEvent(index);
        listItem.appendChild(editButton);
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.classList.add('delete-btn');
        deleteButton.onclick = () => deleteEvent(index);
        listItem.appendChild(deleteButton);
        eventList.appendChild(listItem);
    });
}
function addEvent() {
    const eventName = document.getElementById('event-name').value.trim();
    const eventDate = document.getElementById('event-date').value;
    if (!eventName || !eventDate) {
        alert('Please enter both event name and date.');
        return;
    }
    events.push({ name: eventName, date: eventDate });
    renderEvents();
    document.getElementById('event-name').value = '';
    document.getElementById('event-date').value = '';
}
function editEvent(index) {
    const newName = prompt('Edit Event Name:', events[index].name);
    const newDate = prompt('Edit Event Date (YYYY-MM-DD):', events[index].date);
    if (newName && newDate) {
        events[index] = { name: newName, date: newDate };
        renderEvents();
    } else {
        alert('Both name and date are required to edit.');
    }
}
function deleteEvent(index) {
    if (confirm('Are you sure you want to delete this event?')) {
        events.splice(index, 1);
        renderEvents();
    }
}
renderEvents();
</script>
</body>
</html>
