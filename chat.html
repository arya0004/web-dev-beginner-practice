<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Chat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background-color: white; */
            font-family: Arial, sans-serif;
        }
        .chat-container {
            width: 320px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #005f99;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-box {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-image: url('https://www.shutterstock.com/image-vector/social-media-sketch-vector-seamless-600nw-1660950727.jpg');
            background-size: cover;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background: #005f99;
        }
        .chat-input input {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 10px;
            outline: none;
        }
        .chat-input button {
            background: #005f99;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .message {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 10px;
            max-width: 80%;
        }
        .sent {
            align-self: flex-end;
            background: #0055ff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chit Chat</div>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>
    <script>
        function sendMessage() {
            const messageInput = document.getElementById("message");
            const chatBox = document.getElementById("chat-box");
            
            if (messageInput.value.trim() !== "") {
                const messageElement = document.createElement("div");
                messageElement.classList.add("message", "sent");
                messageElement.textContent = messageInput.value;
                chatBox.appendChild(messageElement);
                chatBox.scrollTop = chatBox.scrollHeight;
                messageInput.value = "";
            }
        }
    </script>
</body>
</html>
