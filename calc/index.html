<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear">C</button>
            <button class="operator" data-value="(">(</button>
            <button class="operator" data-value=")">)</button>
            <button class="operator" data-value="/">÷</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="number" data-value="0">0</button>
            <button class="operator" data-value=".">.</button>
            <button class="equals">=</button>
            <button class="backspace">⌫</button>

            <button class="scientific" data-value="Math.sqrt">√</button>
            <button class="scientific" data-value="Math.pow">xʸ</button>
            <button class="scientific" data-value="Math.sin">sin</button>
            <button class="scientific" data-value="Math.cos">cos</button>

            <button class="scientific" data-value="Math.tan">tan</button>
            <button class="scientific" data-value="Math.log">log</button>
            <button class="scientific" data-value="Math.exp">e^x</button>
            <button class="scientific" data-value="Math.PI">π</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
