<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Student Registration</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Registration Form -->
    <div class="container">
        <h2>Student Registration</h2>
        <form id="registration-form" action="success.html" method="POST">
            <label for="name">Full Name</label><br>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" required>

            <label for="dob">Date of Birth</label><br>
            <input type="date" id="dob" name="dob" required>

            <label for="age">Age</label><br>
            <input type="number" id="age" name="age" min="18" required>

            <label for="phone">Phone Number</label><br>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

            <label for="gender">Gender</label><br>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
            </select>

            <label>Security Question</label><br>
            <select name="security_question" required>
                <option disabled selected>Select a security question</option>
                <option>What is your mother's maiden name?</option>
                <option>What was the name of your first pet?</option>
            </select>

            <label for="security-answer">Answer</label><br>
            <input type="text" id="security-answer" name="security_answer" required>

            <label for="education">Education Background</label><br>
            <select id="education" name="education" required>
                <option disabled selected>Select your highest education level</option>
                <option>High School</option>
                <option>Associate Degree</option>
                <option>Bachelor's Degree</option>
                <option>Master's Degree</option>
                <option>Doctorate (PhD)</option>
                <option>Other</option>
            </select>

            <button type="submit" id="submit-button">Register</button>
        </form>
        <p class="login-link">Already registered? <a href="login.html">Login here</a></p>
    </div>
    <marquee> <img src="https://cdn.dribbble.com/users/871223/screenshots/3147686/baymax.gif" alt="Baymax" height="50">
    </marquee>
       

</body>
</html>
